name: Supabase Keepalive

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://mktbftramoiplbfdyidw.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY_FALLBACK: sb_publishable_KWeVnQTHr7bpaT27SGyr6w_82h1ODwd
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "SUPABASE_ANON_KEY is not set; using public publishable key fallback"
            SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY_FALLBACK"
          fi

          URL="$SUPABASE_URL/rest/v1/book_messages?select=id&limit=1"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          echo "Pinging Supabase: $URL"

          HTTP_STATUS="$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$RESPONSE_FILE" -w "%{http_code}" \
            "$URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json")"

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Supabase keepalive failed"
            exit 1
          fi

          echo "Supabase keepalive succeeded"
